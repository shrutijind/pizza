<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
    <title>izza</title>

    <style>
        /* Centre map on hero image */

        .map {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 90px 20px 30px;
        }
       

        /* Map size */

        .map iframe {
            width: 100%;
            max-width: 600px;
            height: 450px;
            border: none;
        }
        
        /* Mobile screen */

        @media (max-width: 767px) {

            .map iframe {
                height: 300px;
            }

        }
        /* Close button */

.map .view-map-btn {
    position: fixed;
    top: 80px;
    right: 20px;
    display: inline-block;
    width: auto;
    height: auto;
    padding: 5px 10px;
    font-size: 14px;
    color: white;
    background-color: black;
    border: 1px solid white;
    text-decoration: none;
    white-space: nowrap;
    z-index: 2000;
}

/* Mobile screens */

@media (max-width: 767px) {
    .map .view-map-btn {
        position: fixed;
        top: 110px;
        right: 15px;
        font-size: 12px;
        padding: 5px 8px;
        z-index: 2000;
    }
}
    </style>
</head>
