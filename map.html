    <style>
        /* Centre map on hero image */

        .map {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 90px 20px 30px;
        }

        /* Map size */

        .map iframe {
            width: 100%;
            max-width: 600px;
            height: 450px;
            border: none;
        }
        .view-map-btn {
            position: absolute;
            top: 100px;
            right: 30px;
            background-color: #000;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            color:white;
        
            
        }
        /* Mobile screen */

        @media (max-width: 767px) {

            .map iframe {
                height: 300px;
            }

        }
    </style>
